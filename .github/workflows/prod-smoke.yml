name: Production Smoke

on:
  workflow_dispatch:

concurrency:
  group: prod-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  prod-smoke:
    runs-on: ubuntu-latest
    env:
      APP_SUPABASE_URL: ${{ secrets.APP_SUPABASE_URL }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APP_SUPABASE_SERVICE_ROLE_KEY }}
      DISPATCHER_V2_ALLOWLIST_ENABLED: ${{ secrets.DISPATCHER_V2_ALLOWLIST_ENABLED }}
      PROD_SMOKE_DELIVERY_LOG_LOOKBACK_HOURS: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Run read-only production smoke tests
        run: npm run test:prod-smoke
